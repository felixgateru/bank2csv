[workspace]
resolver = "2"
members = ["crates/core", "crates/extract", "crates/banks", "crates/wasm", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bank2csv-core = { path = "crates/core" }
bank2csv-extract = { path = "crates/extract" }
bank2csv-banks = { path = "crates/banks", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
